services:
  - type: web
    name: snake-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HUEVO_APP_ID
        sync: false
      - key: HUEVO_CLIENT_ID
        sync: false
      - key: HUEVO_CLIENT_SECRET
        sync: false
      - key: SNAKE_SESSION_SECRET
        generateValue: true
